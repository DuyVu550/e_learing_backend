spring.datasource.url=jdbc:h2:mem:learning_backend_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-test-secret-key-test-secret-key
app.jwt.issuer=learning-backend-test
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

app.payos.base-url=http://localhost:9999
app.payos.client-id=test-client-id
app.payos.api-key=test-api-key
app.payos.checksum-key=test-checksum-key
app.payos.return-url=http://localhost:8080/api/payments/payos/return
app.payos.cancel-url=http://localhost:8080/api/payments/payos/cancel

app.admin.email=admin@test.local
app.admin.password=Admin@12345
app.admin.full-name=Test Admin
