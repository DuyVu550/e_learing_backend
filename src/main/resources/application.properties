spring.application.name=learning-backend

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/e_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key-change-this-secret-key}
app.jwt.issuer=learning-backend
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

server.port=8080

