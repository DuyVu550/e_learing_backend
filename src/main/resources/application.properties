spring.application.name=learning-backend

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/e_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:dev-secret-key-dev-secret-key-123456}
app.jwt.issuer=learning-backend
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

# PayOS credentials are secrets, so they live in application-local.properties (git-ignored).
# Without them the app still starts and only checkout fails, so a clean clone stays runnable.
spring.config.import=optional:classpath:application-local.properties

app.payos.base-url=${PAYOS_BASE_URL:https://api-merchant.payos.vn}
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/api/payments/payos/return}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/api/payments/payos/cancel}

# Bootstrap admin. ADMIN cannot be self-assigned through the API, so this seed is the only way in.
# Override the password in application-local.properties (or ADMIN_PASSWORD) before any real deploy;
# the account is created only when missing, so an existing admin's password is never reset.
app.admin.email=${ADMIN_EMAIL:admin@learning.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.full-name=${ADMIN_FULL_NAME:System Admin}

server.port=8080


